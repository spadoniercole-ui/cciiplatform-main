name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      # Include scripts/check-use-server-exports.sh ('use server' + handler nei Server Component)
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build cloud
        run: npm run build

  immagine-server:
    name: Immagine Docker edizione server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Solo costruzione (nessuna pubblicazione): verifica che server/Dockerfile
      # resti allineato al codice.
      - name: Build immagine
        run: docker build -f server/Dockerfile -t ccii-platform:ci .
